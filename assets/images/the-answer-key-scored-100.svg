<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#222222">Calibrating the scale before any contestant is good</text>

  <!-- axis -->
  <line x1="60" y1="190" x2="700" y2="190" stroke="#444444" stroke-width="1.5"/>
  <g fill="#444444" font-size="12">
    <line x1="60" y1="184" x2="60" y2="196" stroke="#444444"/>
    <text x="60" y="214" text-anchor="middle">0</text>
    <line x1="220" y1="184" x2="220" y2="196" stroke="#444444"/>
    <text x="220" y="214" text-anchor="middle">25</text>
    <line x1="380" y1="184" x2="380" y2="196" stroke="#444444"/>
    <text x="380" y="214" text-anchor="middle">50</text>
    <line x1="540" y1="184" x2="540" y2="196" stroke="#444444"/>
    <text x="540" y="214" text-anchor="middle">75</text>
    <line x1="700" y1="184" x2="700" y2="196" stroke="#444444"/>
    <text x="700" y="214" text-anchor="middle">100</text>
  </g>

  <!-- reference lists, above the axis, dashed -->
  <text x="24" y="66" font-weight="600" fill="#444444">Reference lists, computed from the ground truth</text>

  <g>
    <line x1="700" y1="190" x2="700" y2="90" stroke="#5f9c72" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="596" y="74" width="140" height="34" rx="6" fill="#e6f2ea" stroke="#5f9c72"/>
    <text x="666" y="90" text-anchor="middle" fill="#3d5c3d" font-weight="600" font-size="12">the answer key</text>
    <text x="666" y="103" text-anchor="middle" fill="#3d5c3d" font-size="11">100: the maths work</text>
  </g>

  <g>
    <line x1="329" y1="190" x2="329" y2="128" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="259" y="112" width="160" height="34" rx="6" fill="#eef1f5" stroke="#9aa5b1"/>
    <text x="339" y="128" text-anchor="middle" fill="#222222" font-weight="600" font-size="12">the hire at rank 1</text>
    <text x="339" y="141" text-anchor="middle" fill="#555555" font-size="11">about 42</text>
  </g>

  <g>
    <line x1="111" y1="190" x2="111" y2="128" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="48" y="112" width="166" height="34" rx="6" fill="#eef1f5" stroke="#9aa5b1"/>
    <text x="131" y="128" text-anchor="middle" fill="#222222" font-weight="600" font-size="12">20 approvable people</text>
    <text x="131" y="141" text-anchor="middle" fill="#555555" font-size="11">about 8 (was 0 under the old ladder)</text>
  </g>

  <!-- contestants, below the axis, solid -->
  <text x="24" y="250" font-weight="600" fill="#444444">Contestants</text>

  <g>
    <line x1="60" y1="190" x2="60" y2="262" stroke="#8a3333" stroke-width="1.5"/>
    <rect x="24" y="262" width="150" height="34" rx="6" fill="#fbeeee" stroke="#c98484"/>
    <text x="99" y="278" text-anchor="middle" fill="#8a3333" font-weight="600" font-size="12">brute-force baseline</text>
    <text x="99" y="291" text-anchor="middle" fill="#8a3333" font-size="11">0: universe never reaches the funnel</text>
  </g>

  <g>
    <line x1="79" y1="190" x2="240" y2="262" stroke="#777777" stroke-width="1.5"/>
    <rect x="200" y="262" width="170" height="34" rx="6" fill="#eef1f5" stroke="#9aa5b1"/>
    <text x="285" y="278" text-anchor="middle" fill="#222222" font-weight="600" font-size="12">deep-sourcing skill</text>
    <text x="285" y="291" text-anchor="middle" fill="#555555" font-size="11">3: finds 19% of the funnel, ranks it badly</text>
  </g>

  <text x="24" y="320" fill="#555555" font-size="12">Dashed markers were placed before the first real run. Without them, 0 and 3 would both just read "bad".</text>
</svg>
