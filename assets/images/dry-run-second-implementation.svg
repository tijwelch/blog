<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#fafafa"/>

  <!-- Left: the enforcer -->
  <rect x="30" y="50" width="340" height="255" rx="10" fill="#ffffff" stroke="#222222" stroke-width="3"/>
  <text x="200" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#222222">Enforce</text>
  <text x="200" y="105" text-anchor="middle" font-size="13" fill="#777777">acts — once a week, in a transaction</text>

  <text x="52" y="146" font-size="14" fill="#333333">1. refuse excluded</text>
  <text x="52" y="165" font-size="12" fill="#888888">outranks a pin</text>

  <text x="52" y="206" font-size="14" fill="#333333">2. retire new roles</text>
  <text x="52" y="225" font-size="12" fill="#888888">a pin survives this</text>

  <text x="52" y="266" font-size="14" font-weight="600" fill="#8a3333">3. evict below cutoff</text>
  <text x="52" y="285" font-size="12" fill="#8a3333">only when a caller passes a cap</text>

  <!-- Right: the preview -->
  <rect x="510" y="50" width="340" height="255" rx="10" fill="#ffffff" stroke="#999999" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="680" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#222222">Departures</text>
  <text x="680" y="105" text-anchor="middle" font-size="13" fill="#777777">predicts — on every page load</text>

  <text x="532" y="146" font-size="14" fill="#333333">1. refusals</text>
  <text x="532" y="165" font-size="12" fill="#888888">outranks a pin</text>

  <text x="532" y="206" font-size="14" fill="#333333">2. retirements</text>
  <text x="532" y="225" font-size="12" fill="#888888">a pin survives this</text>

  <text x="532" y="266" font-size="14" font-weight="600" fill="#8a3333">3. — not modelled —</text>
  <text x="532" y="285" font-size="12" fill="#8a3333">no tag, no Keep button</text>

  <!-- Drift connectors -->
  <line x1="372" y1="141" x2="506" y2="141" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="372" y1="201" x2="506" y2="201" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="372" y1="261" x2="506" y2="261" stroke="#c9a0a0" stroke-width="2" stroke-dasharray="5 5"/>

  <text x="440" y="120" text-anchor="middle" font-size="12" fill="#777777">restated</text>
  <text x="440" y="180" text-anchor="middle" font-size="12" fill="#777777">restated</text>
  <text x="440" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#8a3333">missing</text>

  <!-- Shared resolver -->
  <rect x="270" y="350" width="340" height="62" rx="10" fill="#ffffff" stroke="#1f5c33" stroke-width="2.5"/>
  <text x="440" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5c33">EmploymentProfiles.ids_for</text>
  <text x="440" y="397" text-anchor="middle" font-size="12" fill="#3d7a52">the one piece both sides literally share</text>

  <line x1="200" y1="305" x2="300" y2="350" stroke="#1f5c33" stroke-width="2.5"/>
  <line x1="680" y1="305" x2="580" y2="350" stroke="#1f5c33" stroke-width="2.5"/>

  <text x="440" y="443" text-anchor="middle" font-size="13" fill="#666666" font-style="italic">Solid line: one function, compiler-enforced. Dashed line: two paragraphs of prose that happen to agree today.</text>
</svg>
