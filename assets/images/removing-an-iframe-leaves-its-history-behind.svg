<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#222">One Back button, one history list, shared by the page and every frame in it</text>

  <text x="24" y="78" fill="#555">Before Reload</text>
  <g>
    <rect x="150" y="58" width="120" height="34" rx="6" fill="#eef1f5" stroke="#9aa5b1"/>
    <text x="210" y="80" text-anchor="middle" fill="#222">page: /lists</text>
    <rect x="280" y="58" width="120" height="34" rx="6" fill="#eef1f5" stroke="#9aa5b1"/>
    <text x="340" y="80" text-anchor="middle" fill="#222">page: /app</text>
    <rect x="410" y="58" width="120" height="34" rx="6" fill="#e6f2ea" stroke="#5f9c72"/>
    <text x="470" y="80" text-anchor="middle" fill="#222">frame: /campaigns</text>
    <rect x="540" y="58" width="120" height="34" rx="6" fill="#e6f2ea" stroke="#5f9c72"/>
    <text x="600" y="80" text-anchor="middle" fill="#222">frame: /campaigns/42</text>
  </g>

  <text x="24" y="168" fill="#555">After Reload</text>
  <text x="24" y="186" fill="#888" font-size="12">(new &lt;iframe&gt;)</text>
  <g>
    <rect x="150" y="148" width="120" height="34" rx="6" fill="#eef1f5" stroke="#9aa5b1"/>
    <text x="210" y="170" text-anchor="middle" fill="#222">page: /lists</text>
    <rect x="280" y="148" width="120" height="34" rx="6" fill="#eef1f5" stroke="#9aa5b1"/>
    <text x="340" y="170" text-anchor="middle" fill="#222">page: /app</text>
    <rect x="410" y="148" width="120" height="34" rx="6" fill="#f7f7f7" stroke="#bbb" stroke-dasharray="5 4"/>
    <text x="470" y="170" text-anchor="middle" fill="#999">dead</text>
    <rect x="540" y="148" width="120" height="34" rx="6" fill="#f7f7f7" stroke="#bbb" stroke-dasharray="5 4"/>
    <text x="600" y="170" text-anchor="middle" fill="#999">dead</text>
  </g>
  <path d="M600 196 C 600 226, 470 226, 470 200" fill="none" stroke="#c0504d" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M470 196 C 470 236, 340 236, 340 200" fill="none" stroke="#c0504d" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="535" y="248" text-anchor="middle" fill="#c0504d" font-size="13">Back #1 and #2: the entry pops, nothing on screen changes</text>
  <text x="24" y="282" fill="#555" font-size="13">The old frame's entries outlive the frame. Nothing is left to navigate when Back lands on them.</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0504d"/>
    </marker>
  </defs>
</svg>
