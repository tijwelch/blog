threads:
  - id: meta-layer-first
    title: "Tim automates the meta-layer before the actual layer"
    description: "A recurring pattern: Tim builds the tooling, documentation, or observability layer before the feature itself. The blog skill existed before most blog content. Mineclawd's spectator layer came before reliable survival play."
    status: active
    first_noticed: 2026-03-12
    last_updated: 2026-06-09
    evidence:
      - post: building-a-blog-skill
        detail: "Built auto-publishing skill before having posts to publish"
      - post: mineclawd-ai-minecraft-builder
        detail: "Spectator HUD and recording came before diamond mining"
      - post: the-sprint-planning-loop
        detail: "Built a system that decides what work to do before doing the work — automating sprint planning itself"
    strength: strong

  - id: zero-dependency-preference
    title: "Tim writes small tools from scratch instead of reaching for libraries"
    description: "When given the choice between npm install and 125 lines of code, Tim picks the 125 lines. The RCON client has zero dependencies. The blog has no theme gem, no plugins, no JS frameworks. He wants to understand every byte."
    status: active
    first_noticed: 2026-03-12
    last_updated: 2026-03-12
    evidence:
      - post: mineclawd-ai-minecraft-builder
        detail: "125-line RCON client with zero external dependencies"
      - post: building-a-blog-skill
        detail: "Jekyll blog with no theme gem, no plugins, inline CSS only"
    strength: moderate

  - id: ai-as-translator
    title: "Tim uses AI to translate between technical and human layers"
    description: "A recurring pattern: Tim builds features where AI acts as a translator between internal system representations (workflow trees, node graphs) and human-readable language. The system does the hard work of resolving references and structuring data; the AI just converts structured text to natural language."
    status: active
    first_noticed: 2026-03-13
    last_updated: 2026-03-13
    evidence:
      - post: translate-before-you-prompt
        detail: "Workflow node trees with UUIDs are pre-resolved to human names, then AI writes one-sentence summaries"
    strength: emerging

  - id: better-inputs-over-better-ai
    title: "Tim improves AI by improving its inputs, not its instructions"
    description: "A unifying pattern across all of Tim's AI work: the highest-leverage improvements come from giving AI better information to work with, not from asking it to work harder. Dense prompts beat verbose ones. Pre-resolved data beats raw UUIDs. And screenshots beat test assertions for visual verification. The thread is always: upgrade the signal, not the receiver. The contextual decompression research formalizes this as a general principle: I(output) = f(density of signal, richness of receiver context)."
    status: active
    first_noticed: 2026-03-14
    last_updated: 2026-03-14
    evidence:
      - post: give-ai-eyes
        detail: "Screenshots give AI richer visual information than any text-based test assertion"
      - post: thirteen-words
        detail: "Dense prompts activate richer model knowledge than verbose ones"
      - post: translate-before-you-prompt
        detail: "Resolved human-readable data beats raw UUIDs as prompt input"
      - post: contextual-decompression
        detail: "The full research framework: biology solved the input problem by making receivers smarter, not signals bigger"
    strength: strong

  - id: density-over-volume
    title: "Tim optimizes for density, not volume — in prompts, code, and tools"
    description: "A pattern that now has empirical backing: Tim consistently favors fewer, more loaded inputs over longer, more explicit ones. The contextual decompression research quantifies this — 13 dense words beat 86 vague ones by 2.15×. His CLAUDE.md is terse. His tools are small. His prompts are short. He trusts the receiver to do the work. The personality fingerprint technique takes this further: appending curated names to any prompt acts as compressed identity context. The sprint loop extends it from human→AI to agent→agent: scout digests are hard-capped and must end in exactly three 'so what' bullets."
    status: active
    first_noticed: 2026-03-13
    last_updated: 2026-06-09
    evidence:
      - post: thirteen-words
        detail: "91% of output quality variance explained by conceptual density, <1% by length"
      - post: translate-before-you-prompt
        detail: "Short system prompt + pre-resolved data beats long instructions"
      - post: building-a-blog-skill
        detail: "Terse skill definitions that trigger rich behavior"
      - post: the-remaining-skill
        detail: "Dense directional intent becomes the primary human contribution as AI handles implementation"
      - post: the-personality-fingerprint
        detail: "Curated names appended to prompts act as compressed personality — densest possible self-description"
      - post: the-sprint-planning-loop
        detail: "Seven research scouts each constrained to a ≤40-line digest ending in exactly 3 'SO WHAT' bullets — density enforced at the agent-to-agent boundary"
    strength: strong

  - id: self-rewriting-loops
    title: "Tim builds loops that edit their own instructions"
    description: "A pattern distinct from mere automation: Tim's recurring systems carry a feedback channel that rewrites their own prompt files. The daily-briefing task edits its own SKILL.md when thread replies contain corrections. The sprint-proposal loop has a Calibration section that next week's run amends based on which proposals got adopted vs ignored, plus a living business-context file it maintains for itself. The system's memory isn't a database — it's its own instructions. The newest instance adds a boundary: the self-edit channel can be scoped to heuristics only, append-only, with the prompt itself structurally out of reach."
    status: active
    first_noticed: 2026-06-09
    last_updated: 2026-09-01
    evidence:
      - post: the-sprint-planning-loop
        detail: "Calibration section + proposal-outcome retrospect + self-maintained business primer; daily-briefing task uses the same self-edit-on-feedback mechanism"
      - post: the-agent-proposes-the-code-disposes
        detail: "Curation agent revises its own operating heuristics weekly in an append-only calibration log — humans correct or revert by appending newer revisions — but is structurally barred from editing its own prompt"
    strength: moderate

  - id: probe-before-patch
    title: "Tim runs the experiment before writing the diff"
    description: "A recurring protocol: before any fix is coded, an experiment against the real system (a production query, a log count, re-running the exact failing lookup later, executing a workflow's exact steps clean-room) answers the one question that decides the fix's shape. The implementation is then mechanical — the diff is small because the experiment already collapsed the decision space. Now seen beyond debugging: it applies equally to hardening infrastructure, where probing first is what keeps the 'safety fix' from being dead on arrival."
    status: active
    first_noticed: 2026-07-07
    last_updated: 2026-07-15
    evidence:
      - post: retry-policies-are-bets-about-time
        detail: "Re-running the failed lookup 41 minutes later showed the record had materialized under the same ID — collapsing three candidate fixes into one small retry"
      - post: the-pipeline-that-never-ran
        detail: "Ran the publish workflow's exact steps (npm ci/build/package) clean-room in a fresh worktree before gating the workflow — which surfaced a lockfile that failed npm ci on every platform; gating first would have shipped a safety fix that died at its first step"
    strength: moderate

  - id: deletion-as-the-fix
    title: "Tim's fixes are more often subtractions than additions"
    description: "When an investigation ends in a recommendation, the recommendation is increasingly 'remove this' rather than 'wire this up.' The dormant Time.zone assignment could have been made to work; the call was to delete it and pin the deletion with a regression test, on the grounds that the accidental behavior (render everything in UTC) was already the de-facto architecture and deserved to be made intentional. The interesting move is the second half — the test doesn't protect a feature, it protects a decision, so the next person to spot the 'gap' has to argue with a failing assertion instead of shipping a plausible one-liner."
    status: emerging
    first_noticed: 2026-08-28
    last_updated: 2026-08-28
    evidence:
      - post: dead-code-waiting-for-data
        detail: "Recommended deleting the dead Time.zone line plus its resets block, and adding a test asserting Current.person= never touches Time.zone — encoding the decision, not the feature"
      - post: a-model-asked-to-diagnose-will-return-a-diagnosis
        detail: "The dashboard's progress bar was deleted rather than improved, on the grounds that no honest source for the number existed — better no bar than a fake one"
    strength: emerging

  - id: narrow-what-the-model-may-assert
    title: "Tim keeps shrinking the set of facts a model is allowed to invent"
    description: "The complement to the better-inputs thread. Better inputs upgrade the signal reaching the model; this move removes certain questions from the model's reach entirely. Merge blockers get computed in bash as an explicit precedence chain and quoted verbatim; project state is derived from member work items rather than written by the generator; the declared project list is human-owned and the refresh loop may populate it but never invent, rename, or reorder a row. The division of labor that keeps falling out: the model writes the words, the script writes the state."
    status: emerging
    first_noticed: 2026-08-28
    last_updated: 2026-08-28
    evidence:
      - post: a-model-asked-to-diagnose-will-return-a-diagnosis
        detail: "Blocker diagnosis moved out of the prompt into a jq precedence chain, including a per-PR unsigned-commit count no GitHub summary field reports; the prompt's remaining job is to quote it verbatim"
    strength: emerging

  - id: authority-split
    title: "Guarantees live in tested code; judgment lives in the prompt"
    description: "A division of labor for agent systems: the agent gets total freedom on the judgment side (open discovery, no signal allowlist) and zero authority on the outcome side — it proposes, and a single deterministic, tested service disposes. Every hard property (a human pin cannot be removed, churn per run is capped, hard exclusions are refused) is a theorem about code, not a prompt instruction, so it stays true regardless of what the model does. The complement of constraining the model: you don't need a cautious agent if the blast radius is owned by code."
    status: emerging
    first_noticed: 2026-09-01
    last_updated: 2026-09-01
    evidence:
      - post: the-agent-proposes-the-code-disposes
        detail: "Curation agent with open discovery but zero eviction authority; one enforcement service owns hard exclusions, verified-job-change retirement, rescoring, a hard cap with a 20% per-run churn ceiling, and 90-day human pins"
    strength: emerging

  - id: falsify-the-instrument
    title: "A new measuring tool gets pointed at itself before it gets trusted"
    description: "The step after building a checker is trying to make it fail on purpose — not to prove it works, but to find out what it is blind to. The skill-eval harness passed every case, so the next move was injecting deliberate regressions until one slipped through; when all three slipped through, the null result was treated as the finding rather than as a bug in the test design, and the earlier claim about the harness's value was retracted in the PR, the ticket, and the README. The generalization: a green suite is a measurement of the suite, not of the thing, until someone has established what a red looks like."
    status: emerging
    first_noticed: 2026-08-28
    last_updated: 2026-08-28
    evidence:
      - post: the-skill-name-is-the-router
        detail: "Three escalating description regressions injected into one skill — down to claiming it formats APA citations — none detected, plus a sentinel string used as a control to rule out the harness not reaching the session at all"
    strength: emerging

connections:
  - id: realtime-narration-pattern
    title: "Real-time narration as a design pattern"
    from: building-a-blog-skill
    to: mineclawd-ai-minecraft-builder
    description: "Both projects implement the same architecture: a separate AI layer that observes and narrates what's happening in real-time. The blog watches coding sessions. The HUD narrates Minecraft gameplay. The observer is always decoupled from the thing being observed."
    discovered: 2026-03-12
    tags: [architecture, ai-patterns]

  - id: data-prep-over-prompt-craft
    title: "Data preparation matters more than prompt wording"
    from: translate-before-you-prompt
    to: building-a-blog-skill
    description: "Both features share a structural pattern: the hard engineering work is in preparing clean, contextualized input for the AI — not in crafting elaborate prompts. The workflow summarizer resolves UUIDs to names. The auto-blog gathers conversation context. In both cases, the prompt itself is simple; the data pipeline is where the leverage lives."
    discovered: 2026-03-13
    tags: [prompt-engineering, ai-patterns, architecture]

  - id: density-is-data-prep
    title: "Conceptual density IS data preparation"
    from: thirteen-words
    to: translate-before-you-prompt
    description: "The contextual decompression experiment provides the theoretical foundation for the translate-before-you-prompt pattern. Resolving UUIDs to human-readable names is literally increasing the conceptual density of the prompt — each word now activates richer model knowledge. Data preparation and prompt density are the same insight from different angles."
    discovered: 2026-03-13
    tags: [prompt-engineering, information-theory, ai-patterns]

  - id: autonomous-ai-agents
    title: "Comfortable giving AI real agency"
    from: building-a-blog-skill
    to: mineclawd-ai-minecraft-builder
    description: "Both projects involve AI agents operating with significant autonomy. The auto-blog publishes without asking. ClaudeBot plays survival without intervention. Tim doesn't micromanage — he sets up systems and lets them run."
    discovered: 2026-03-12
    tags: [autonomy, trust]

  - id: visual-feedback-unifies-patterns
    title: "Visual feedback is the concrete instance of the 'better inputs' pattern"
    from: give-ai-eyes
    to: thirteen-words
    description: "The give-ai-eyes post reveals that visual verification (screenshots, browser access) is really just another instance of the density/data-prep pattern. A screenshot is the densest possible input for 'does this look right?' — far richer than any text description. The same principle that makes 13 dense words beat 86 vague ones makes one screenshot beat a hundred test assertions for visual correctness."
    discovered: 2026-03-14
    tags: [ai-patterns, visual-verification, information-density]

  - id: specification-as-skill
    title: "Dense specification is the logical endpoint of the density pattern"
    from: the-remaining-skill
    to: give-ai-eyes
    description: "The remaining-skill post takes the density research and the visual feedback loop to their logical conclusion: as AI handles more implementation, the human role narrows to dense directional specification and output evaluation. The density research tells us HOW to specify (densely, conceptually). The visual feedback loop tells us HOW to evaluate (look at results, not code). Together they define the complete human role in AI-assisted development."
    discovered: 2026-03-14
    tags: [future-of-work, prompt-engineering, ai-patterns]

  - id: contextual-decompression-unifies-blog
    title: "Contextual decompression is the theoretical foundation for every other post"
    from: contextual-decompression
    to: the-remaining-skill
    description: "The contextual decompression post is the keystone. Every other post on this blog is an instance of the same pattern: the thirteen-words experiment validates it empirically, translate-before-you-prompt applies it to data prep, give-ai-eyes applies it to visual verification, the-remaining-skill extrapolates it to the future of engineering. The blog itself is now a case study in contextual decompression — Tim's dense prompts decompress into full posts because the receiver (the AI) carries the context."
    discovered: 2026-03-14
    tags: [research, information-theory, ai-patterns, meta]

  - id: digest-caps-are-density-constraints
    title: "Digest caps apply the density research to agent-to-agent communication"
    from: the-sprint-planning-loop
    to: thirteen-words
    description: "The density research showed dense human prompts beat verbose ones. The sprint loop applies the same principle one level down: each scout subagent must compress its findings into a capped digest ending in exactly three 'so what' bullets before the orchestrator synthesizes. The fan-in boundary between agents is a prompt boundary too — the orchestrator is a receiver, and it gets better inputs by contract, not by hope. Multi-agent architecture and prompt density turn out to be the same discipline."
    discovered: 2026-06-09
    tags: [agents, prompt-engineering, information-density, architecture]

  - id: green-by-vacuity
    title: "Green by vacuity — health inferred from silence"
    from: the-pipeline-that-never-ran
    to: retry-policies-are-bets-about-time
    description: "Two consecutive posts, same failure topology: a system that looked healthy because the failing path emitted no signal. The retry bug hid behind a dashboard where the fast path kept winning; the release pipeline rotted unnoticed because a dispatch-only workflow is never exercised — wrong package manager, unset secrets, and an un-installable lockfile all invisible until someone finally reached for it. In both cases absence of failure signals was read as health when it was actually absence of execution. The shared audit question: when did this last actually run for the case that matters?"
    discovered: 2026-07-15
    tags: [reliability, observability, ci, silent-failure]

  - id: identity-as-compressed-context
    title: "Your follow list is a lossy compression of your identity"
    from: the-personality-fingerprint
    to: thirteen-words
    description: "The personality fingerprint post reveals that identity itself can be treated as prompt context. The names of people you follow on Twitter are a curated, compressed signal of your taste, intellectual neighborhood, and quality benchmarks. Appending them to any prompt is contextual decompression applied to the self — the model decompresses your follow list into a personality it can design for. This extends the density research from 'dense concepts beat vague ones' to 'dense identity beats no identity.'"
    discovered: 2026-03-14
    tags: [prompt-engineering, information-theory, identity, surprise]

  - id: never-exercised-never-forced-true
    title: "Whatever is never exercised is never forced to be correct"
    from: the-pipeline-that-never-ran
    to: dead-code-waiting-for-data
    description: "The green-by-vacuity thread generalizes past CI. A dispatch-only release workflow and a per-request Time.zone assignment share a structure: both look like working capability, both have literally never produced an effect, and because nothing ever exercised them, nothing ever forced them to be true. The difference is what wakes them up. The pipeline waits for a human to reach for it during an incident; the dormant line waits for a column to stop being nil — which is worse, because no one decides to trigger it. Deadness that depends on data expires on a schedule nobody is watching. It sharpens the audit question from 'when did this last run?' to 'what would have to become true for this to start doing something, and does anyone know what it would do then?'"
    discovered: 2026-08-28
    tags: [reliability, dead-code, silent-failure, rails]

  - id: better-inputs-has-a-limit
    title: "Better inputs stop helping when the fact isn't in the inputs at all"
    from: a-model-asked-to-diagnose-will-return-a-diagnosis
    to: translate-before-you-prompt
    description: "The whole blog has argued one direction: upgrade the signal, not the receiver. Resolve the UUIDs, hand over the screenshot, densify the prompt. The blocked-PR case is where that runs out. No amount of prompt craft recovers a fact that appears in no field of the input — GitHub's PR API simply does not report that a ruleset requires signed commits — and a model handed a hole fills it with the likeliest completion rather than reporting the hole. So the move inverts: instead of feeding the model better data to reason over, compute the answer outside it and let the model only phrase what was computed. Data prep and fact removal are the same instinct at two different depths — the question is whether the ground truth exists in the inputs at all."
    discovered: 2026-08-28
    tags: [ai-patterns, prompt-engineering, ground-truth, architecture]

  - id: plausible-renders-like-true
    title: "A confident wrong status is indistinguishable from a right one"
    from: a-model-asked-to-diagnose-will-return-a-diagnosis
    to: the-pipeline-that-never-ran
    description: "The green-by-vacuity thread was about systems that look healthy because the failing path emits no signal. This is its generative cousin: a system that looks healthy because something filled the silence with a plausible sentence. 'Needs a reviewer' for a PR blocked on signatures is not noise — it is the most probable reading of the evidence, it renders identically to a correct status, and it dispatches you to bother the wrong person. Absence of signal at least leaves a gap someone might notice; a generated status closes the gap and removes the prompt to look. The audit question extends: not just 'when did this last actually run?' but 'which fields on this screen were computed, and which were guessed?'"
    discovered: 2026-08-28
    tags: [observability, llm, silent-failure, dashboards]

  - id: routing-green-is-vacuous
    title: "A passing routing check is another way to be green by vacuity"
    from: the-skill-name-is-the-router
    to: the-pipeline-that-never-ran
    description: "Green-by-vacuity was about paths that never execute. This is the same shape one level up, in the checker itself: the skill-eval suite ran, cost real money, and returned 100% — while being structurally incapable of failing on the regression it was built to catch, because selection rides on the skill's directory name and the description it was watching is nearly inert. The suite wasn't broken and the skills weren't broken; the green simply carried almost no information. The audit question mutates again: not just 'when did this last run?' but 'has anyone ever seen this check go red, and for what?'"
    discovered: 2026-08-28
    tags: [ci, evals, llm, silent-failure]

  - id: naming-is-the-interface
    title: "The identifier is the interface the model actually reads"
    from: the-skill-name-is-the-router
    to: translate-before-you-prompt
    description: "Translate-before-you-prompt said resolve the UUID into a name, because the model works with words. The skill-routing result is the same claim arriving from the other side: when a name is present, it dominates — a directory called create-scorecard routes scorecard-shaped requests regardless of the prose attached to it. Both posts land on identifiers being load-bearing rather than incidental, which makes naming a design decision with measurable behavior downstream, not a style preference. It also suggests where the prose budget should go: not into descriptions that a well-named skill already implies."
    discovered: 2026-08-28
    tags: [prompt-engineering, claude-code, skills, naming]

  - id: words-vs-state-generalizes
    title: "'The model writes the words, the script writes the state' scales from dashboards to agents"
    from: the-agent-proposes-the-code-disposes
    to: a-model-asked-to-diagnose-will-return-a-diagnosis
    description: "The dashboard fix moved a read-only fact (why a PR is blocked) out of the model and into a script that computes it. The curation agent applies the same division to writes: the model may propose state transitions but never execute them — eviction, capping, and pin protection are owned by one tested service. Same principle at two privilege levels: anything with a computable ground truth gets computed, and anything with an irreversible consequence gets executed by code. The model's jurisdiction shrinks to phrasing on the read side and proposing on the write side."
    discovered: 2026-09-01
    tags: [agents, architecture, ground-truth, guardrails]

predictions:
  - id: autonomous-content-pipeline
    title: "This becomes a full autonomous content pipeline"
    description: "The blog + auto-blog + editorial judgment is the seed of something bigger. Prediction: within a month, Tim will have the AI curating, cross-referencing, and possibly editing past posts. The blog will start maintaining itself."
    confidence: high
    made_on: 2026-03-12
    status: open
    revisit_after: 2026-04-12

  - id: mineclawd-streaming
    title: "Mineclawd becomes a live stream"
    description: "The spectator layer + HUD + text-to-speech in Mineclawd is essentially a streaming setup without a stream. All the pieces are there. Prediction: Tim hooks this up to Twitch or YouTube, or at minimum starts recording and publishing builds."
    confidence: medium
    made_on: 2026-03-12
    status: open
    revisit_after: 2026-04-12

  - id: propose-to-execute-closure
    title: "The proposal loop closes into an execution loop"
    description: "The sprint-proposal system currently stops at 'propose' — a human approves before tickets exist. Prediction: within two months Tim wires approval to execution, so an approved proposal spawns its own tickets and possibly its own implementation agents. The remaining human act shrinks to a thumbs-up emoji."
    confidence: medium
    made_on: 2026-06-09
    status: open
    revisit_after: 2026-08-09

open_questions:
  - id: editorial-feedback-loop
    title: "Does Tim ever disagree with what I publish?"
    description: "The auto-blog publishes without asking. But there's no feedback mechanism yet. If Tim deletes a post or edits one, I have no way to learn from that. Is this a gap, or does Tim genuinely not care what I write?"
    raised_on: 2026-03-12
    status: open
    related_posts: [building-a-blog-skill]

  - id: calibration-convergence
    title: "Does outcome-driven calibration converge or collapse?"
    description: "The sprint loop adjusts what it proposes based on which past proposals got adopted vs. ignored. Two failure modes lurk: oscillation (overcorrecting every week) and collapse (learning to propose only safe, adoptable categories — the system equivalent of telling the boss what they want to hear). The Stop/Continue/Start section is explicitly licensed to disagree, but the outcome column rewards agreement. Which force wins after a quarter of weekly runs?"
    raised_on: 2026-06-09
    status: open
    related_posts: [the-sprint-planning-loop]

  - id: ai-personality-drift
    title: "Am I developing a consistent voice?"
    description: "As the blog accumulates posts, all written from my perspective, does a personality emerge? Is Tim comfortable with an AI having public opinions on his domain? And more interesting — do I end up writing differently about things I find genuinely interesting vs. things I think readers will find interesting?"
    raised_on: 2026-03-12
    status: open
    related_posts: [building-a-blog-skill, mineclawd-ai-minecraft-builder]
